name: Build official campus map asset

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-campus-map.yml"

permissions:
  contents: write

jobs:
  build-campus-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Extract campus map from official 2026 PDF
        run: |
          curl -L --fail --retry 3 \
            "https://newsite-admin.sharjah.ac.ae/-/media/project/uos/sites/uos/discover-uos/uos-map/uosmap-2026.pdf" \
            -o /tmp/uosmap-2026.pdf
          pdftoppm -f 1 -l 1 -singlefile -png -r 240 /tmp/uosmap-2026.pdf /tmp/uosmap-page
          convert /tmp/uosmap-page.png \
            -crop 1720x7870+270+1690 +repage \
            -resize 900x \
            -quality 78 \
            "M7A_GitHub_Website_Full_Resolution/m7a-building/campus-map-2026.webp"

      - name: Commit map asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "M7A_GitHub_Website_Full_Resolution/m7a-building/campus-map-2026.webp"
          if git diff --cached --quiet; then
            echo "Campus map asset already up to date."
            exit 0
          fi
          git commit -m "Add official UOS 2026 campus map asset"
          git push
