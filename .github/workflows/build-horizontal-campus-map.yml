name: Build horizontal campus map

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-horizontal-campus-map.yml"

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create landscape map asset
        run: |
          SRC="M7A_GitHub_Website_Full_Resolution/m7a-building/campus-map-2026.webp"
          OUT="M7A_GitHub_Website_Full_Resolution/m7a-building/campus-map-2026-horizontal.webp"
          convert "$SRC" -rotate 90 -quality 82 "$OUT"
          identify "$OUT"

      - name: Commit landscape map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "M7A_GitHub_Website_Full_Resolution/m7a-building/campus-map-2026-horizontal.webp"
          git commit -m "Add true horizontal campus map asset"
          git push
